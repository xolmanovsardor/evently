version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: evently_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-evently}
      POSTGRES_USER: ${DB_USER:-evently}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evently}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-evently} -d ${DB_NAME:-evently}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: evently_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: evently_bot
    restart: always
    command: python -m bot.main
    env_file:
      - .env
    depends_on:
      - web

  reminders_cron:
    build: .
    container_name: evently_cron
    restart: always
    command: >
      sh -c "while true; do
               python manage.py send_event_reminders;
               sleep 600;
             done"
    env_file:
      - .env
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
